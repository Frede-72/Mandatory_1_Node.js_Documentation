<h1>NPM</h1>
<div class="text-block">
    npm is a package manager and is installed with node.js
<div class="terminal-block">$ npm init</div>
    This creates the package.json file. <br>
    new packages can be installed with:
    <div class="terminal-block">$ npm install {Package}</div>
    To install all packages from package.json run:
    <div class="terminal-block">$ npm install</div>
</div>
</div>
